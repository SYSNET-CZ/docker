name: Secret files check

# Zachytí verzované soubory s klíči a tajemstvími, které GitHub secret scanning
# nevidí (binární keystory .p12/.pfx/.jks, .env, privátní klíče). ADR 008.
# Vypisuje jen CESTY souborů, nikdy jejich obsah.

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  secret-files:
    name: Secret files check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verzované soubory s klíči a tajemstvími
        shell: bash
        run: |
          set -u
          bad=0
          # 1) Podle názvu souboru: .env a binární keystory (šablony .example/.sample/.template/.dist jsou povolené).
          #    Soubory .pem/.key se posuzují jen podle obsahu (krok 2), protože mohou nést i veřejné certifikáty.
          names=$(git ls-files | grep -Ei '(^|/)(\.env(\.[A-Za-z0-9_-]+)?|[^/]*\.(p12|pfx|jks|keystore))$' \
                  | grep -Eiv '\.(example|sample|template|dist)$' || true)
          if [ -n "$names" ]; then
            echo "::error::Ve verzi jsou soubory, které nepatří do gitu (jen cesty):"
            echo "$names" | sed 's/^/  - /'
            bad=1
          fi
          # 2) Podle obsahu: hlavička privátního klíče (vypíše jen názvy souborů)
          keys=$(git grep -lI -E -e '-----BEGIN ((RSA|EC|DSA|OPENSSH|ENCRYPTED) )?PRIVATE KEY-----' -- . ':!*.md' ':!docs' ':!tests' || true)
          if [ -n "$keys" ]; then
            echo "::error::Soubory s hlavičkou privátního klíče (jen cesty):"
            echo "$keys" | sed 's/^/  - /'
            bad=1
          fi
          if [ "$bad" -ne 0 ]; then
            echo "Postup: soubor odstranit z gitu, klíč považovat za kompromitovaný a rotovat (ADR 008). Vzor držet jako *.example."
            exit 1
          fi
          echo "OK: žádné verzované klíče ani .env."
